# Render 免費方案閒置約 15 分鐘就會休眠，喚醒要 30～60 秒，期間網站會抓不到資料。
# 這裡每 5 分鐘 ping 一次後端讓它保持清醒（公開 repo 的 Actions 不計分鐘數）。
# 注意：Render 免費方案每月 750 小時，單一服務全天候運作約 744 小時，剛好夠用。
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 排程可能延遲數分鐘，間隔需小於休眠門檻
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: https://stock-backend-lz9p.onrender.com
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$BACKEND_URL/health"
