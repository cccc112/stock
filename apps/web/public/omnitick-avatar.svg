<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景放射漸層 (深邃量子夜空) -->
    <radialGradient id="avBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141F36" />
      <stop offset="60%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- 台灣黑熊外皮漸層 -->
    <linearGradient id="bearFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 胸前厚實金黃 V 領漸層 (勝利 Victory & VCP 突破) -->
    <linearGradient id="goldV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Omni 量子外環漸層 -->
    <linearGradient id="omniRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 發光濾鏡 -->
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="gblur" />
      <feMerge>
        <feMergeNode in="gblur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 圓形畫布背景 (適合 LINE 圓形頭像裁切) -->
  <rect width="1024" height="1024" fill="url(#avBg)" />

  <!-- 背景氛圍光暈 -->
  <circle cx="512" cy="500" r="360" fill="#00F2FE" opacity="0.08" filter="url(#avGlow)" />
  <circle cx="512" cy="560" r="300" fill="#F59E0B" opacity="0.09" filter="url(#goldGlow)" />

  <!-- 外圍 Omni 量子旋轉軌道環 -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="url(#omniRing)" stroke-width="26" stroke-dasharray="140 40" filter="url(#avGlow)" />
  <circle cx="512" cy="512" r="395" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="12 14" opacity="0.7" />

  <!-- 軌道感應節點 -->
  <circle cx="512" cy="72" r="14" fill="#FFFFFF" filter="url(#avGlow)" />
  <circle cx="952" cy="512" r="16" fill="#10B981" filter="url(#avGlow)" />
  <circle cx="200" cy="824" r="12" fill="#3B82F6" opacity="0.9" />

  <!-- ★ 正宗台灣黑熊 (熊霸 V-Bear) 完整五官特徵 ★ -->
  <g id="taiwan-bear-mascot">
    <!-- 圓圓立體雙耳 (外耳黑色、內耳粉嫩 #fda4af) -->
    <!-- 左耳 -->
    <circle cx="310" cy="300" r="125" fill="#0F172A" stroke="#334155" stroke-width="14" />
    <circle cx="310" cy="300" r="70" fill="#FDA4AF" opacity="0.88" />

    <!-- 右耳 -->
    <circle cx="714" cy="300" r="125" fill="#0F172A" stroke="#334155" stroke-width="14" />
    <circle cx="714" cy="300" r="70" fill="#FDA4AF" opacity="0.88" />

    <!-- 科技耳機天線 (量化雷達感應器 - 天藍弧線與頂端感應球) -->
    <path
      d="M 280 250 Q 512 120 744 250"
      stroke="#38BDF8"
      stroke-width="20"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"
      filter="url(#avGlow)"
    />
    <circle cx="512" cy="155" r="28" fill="#38BDF8" filter="url(#avGlow)" />
    <circle cx="512" cy="155" r="14" fill="#FFFFFF" />

    <!-- 頭部主體 (圓潤萌態黑熊大頭) -->
    <rect x="212" y="250" width="600" height="560" rx="280" fill="#090D16" stroke="#1E293B" stroke-width="14" />

    <!-- 圓滾滾粉紅腮紅 (兩頰可愛紅暈) -->
    <circle cx="320" cy="580" r="42" fill="#F43F5E" opacity="0.45" />
    <circle cx="704" cy="580" r="42" fill="#F43F5E" opacity="0.45" />

    <!-- 靈動大眼睛 (右下角同款：大白眼球 + 黑色大眼珠 + 白色晶亮高光) -->
    <!-- 左眼 -->
    <circle cx="410" cy="460" r="50" fill="#F8FAFC" />
    <circle cx="418" cy="452" r="26" fill="#0F172A" />
    <circle cx="428" cy="442" r="10" fill="#FFFFFF" />

    <!-- 右眼 -->
    <circle cx="614" cy="460" r="50" fill="#F8FAFC" />
    <circle cx="622" cy="452" r="26" fill="#0F172A" />
    <circle cx="632" cy="442" r="10" fill="#FFFFFF" />

    <!-- 乳白色凸出口鼻部 (Muzzle #F1F5F9) -->
    <ellipse cx="512" cy="560" rx="120" ry="85" fill="#F1F5F9" />
    <!-- 黑色倒三角形小鼻 -->
    <path d="M 468 530 L 556 530 L 512 580 Z" fill="#0F172A" />
    <!-- 微笑小嘴 -->
    <path d="M 482 600 Q 512 625 542 600" stroke="#0F172A" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- ★ 核心靈魂標誌：胸前巨大厚實金色「V」字胸標 (勝利 Victory & VCP 突破) ★ -->
    <path
      d="M 330 690 L 512 870 L 694 690"
      stroke="url(#goldV)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      filter="url(#goldGlow)"
    />
  </g>
</svg>
