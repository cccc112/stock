<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景漸層 (圓角卡片) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- 台灣黑熊外皮漸層 -->
    <linearGradient id="bearFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 胸前厚實純白 V 領 (正宗台灣黑熊標誌 & 勝利 Victory) -->
    <linearGradient id="goldV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Omni 量子外環漸層 -->
    <linearGradient id="omniRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 圓角方形主體背景 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)" />

  <!-- 氛圍環 -->
  <circle cx="512" cy="460" r="320" fill="#00F2FE" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="512" cy="500" r="260" fill="#F59E0B" opacity="0.08" filter="url(#softGlow)" />

  <!-- 外圍 Omni 量子圓環 -->
  <circle cx="512" cy="460" r="360" fill="none" stroke="url(#omniRing)" stroke-width="22" stroke-dasharray="110 30" filter="url(#neonGlow)" />
  <circle cx="512" cy="460" r="320" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="10 12" opacity="0.7" />

  <!-- 台灣黑熊 Mascot 圖形 -->
  <g id="taiwan-bear-mascot">
    <!-- 圓圓立體雙耳 -->
    <circle cx="340" cy="280" r="105" fill="#0F172A" stroke="#334155" stroke-width="12" />
    <circle cx="340" cy="280" r="60" fill="#FDA4AF" opacity="0.88" />

    <circle cx="684" cy="280" r="105" fill="#0F172A" stroke="#334155" stroke-width="12" />
    <circle cx="684" cy="280" r="60" fill="#FDA4AF" opacity="0.88" />

    <!-- 科技耳機天線 (天藍弧線與頂端感應球) -->
    <path
      d="M 320 240 Q 512 130 704 240"
      stroke="#38BDF8"
      stroke-width="16"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"
      filter="url(#neonGlow)"
    />
    <circle cx="512" cy="155" r="22" fill="#38BDF8" filter="url(#neonGlow)" />
    <circle cx="512" cy="155" r="11" fill="#FFFFFF" />

    <!-- 頭部主體 (圓潤黑熊大頭) -->
    <rect x="262" y="240" width="500" height="460" rx="230" fill="#090D16" stroke="#1E293B" stroke-width="12" />

    <!-- 圓滾滾粉紅腮紅 -->
    <circle cx="350" cy="510" r="35" fill="#F43F5E" opacity="0.45" />
    <circle cx="674" cy="510" r="35" fill="#F43F5E" opacity="0.45" />

    <!-- 靈動大眼睛 (右下角同款：大白眼球 + 黑色大眼珠 + 白色晶亮高光) -->
    <circle cx="425" cy="410" r="42" fill="#F8FAFC" />
    <circle cx="432" cy="403" r="22" fill="#0F172A" />
    <circle cx="440" cy="394" r="8" fill="#FFFFFF" />

    <circle cx="599" cy="410" r="42" fill="#F8FAFC" />
    <circle cx="606" cy="403" r="22" fill="#0F172A" />
    <circle cx="614" cy="394" r="8" fill="#FFFFFF" />

    <!-- 乳白色凸出口鼻部 (Muzzle #F1F5F9) -->
    <ellipse cx="512" cy="490" rx="100" ry="70" fill="#F1F5F9" />
    <!-- 黑色倒三角形小鼻 -->
    <path d="M 475 465 L 549 465 L 512 505 Z" fill="#0F172A" />
    <!-- 微笑小嘴 -->
    <path d="M 488 525 Q 512 545 536 525" stroke="#0F172A" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- ★ 核心靈魂標誌：胸前巨大厚實純白「V」字胸標 (正宗台灣黑熊靈魂) ★ -->
    <path
      d="M 370 600 L 512 740 L 654 600"
      stroke="#FFFFFF"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- 下方品牌文字標誌 -->
  <text x="512" y="870" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#F8FAFC" letter-spacing="14">OMNITICK</text>
  <text x="512" y="915" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#00F2FE" letter-spacing="8">TAIWAN BEAR QUANT SENTINEL</text>
</svg>
