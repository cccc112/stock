<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- Core Ring Gradient (Cyan to Emerald & Violet) -->
    <linearGradient id="omniRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Candlestick / Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas (Rounded Square) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)" />

  <!-- Subtle Ambient Tech Circles -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="512" cy="512" r="440" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.12" />

  <!-- Soft Ambient Glow behind the glyph -->
  <circle cx="512" cy="490" r="210" fill="#00F2FE" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="512" cy="530" r="180" fill="#10B981" opacity="0.07" filter="url(#softGlow)" />

  <!-- Core 'O' Glyph (Omni Ring) -->
  <!-- Outer thickness 44, smooth rounded geometry -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#omniRing)" stroke-width="46" filter="url(#neonGlow)" />

  <!-- Dynamic Orbit Accents on Ring -->
  <circle cx="512" cy="232" r="14" fill="#FFFFFF" filter="url(#neonGlow)" />
  <circle cx="792" cy="512" r="11" fill="#10B981" filter="url(#neonGlow)" />
  <circle cx="314" cy="710" r="8" fill="#3B82F6" opacity="0.9" />

  <!-- Inner Dynamic Financial "Tick & Candlestick" Core -->
  <g filter="url(#neonGlow)">
    <!-- Candlestick 1 (Left - Small Momentum) -->
    <line x1="390" y1="460" x2="390" y2="590" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <rect x="375" y="490" width="30" height="70" rx="8" fill="#3B82F6" opacity="0.85" />

    <!-- Candlestick 2 (Center - Breakout Surging Bar) -->
    <line x1="512" y1="330" x2="512" y2="670" stroke="#00F2FE" stroke-width="8" stroke-linecap="round" />
    <rect x="492" y="380" width="40" height="210" rx="12" fill="url(#pulseGrad)" />

    <!-- Candlestick 3 (Right - High Expansion Bar) -->
    <line x1="634" y1="390" x2="634" y2="610" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <rect x="619" y="430" width="30" height="130" rx="8" fill="#10B981" opacity="0.9" />

    <!-- Upward Momentum Trend Pulse Line connecting across -->
    <path d="M 330 570 Q 420 540 480 470 T 694 360" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Spark / Arrow head at peak -->
    <polygon points="694,360 660,366 684,394" fill="#FFFFFF" />
  </g>

  <!-- Pulse Beacon Dot at peak -->
  <circle cx="694" cy="360" r="16" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="694" cy="360" r="8" fill="#FFFFFF" />

  <!-- Lower Subtle Brand Sub-bar -->
  <text x="512" y="875" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#F8FAFC" letter-spacing="14">OMNITICK</text>
  <text x="512" y="915" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#00F2FE" letter-spacing="8">QUANTITATIVE RADAR</text>
</svg>
