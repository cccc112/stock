services:
  - type: web
    name: stock-backend
    env: python
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: "cd apps/backend && pip install -r requirements.txt"
    startCommand: "cd apps/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # 台股財報 / 法人籌碼 / 月營收來源。免費註冊 https://finmindtrade.com 取得 token
      - key: FINMIND_API_KEY
        sync: false
      # AI 功能（可不設，改由使用者在網站「設定」頁輸入自己的 Key）
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Neon (Postgres) 連線字串：自選股 / 投資組合 / 模擬交易 / 警報需要。
      # 格式 postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require ；後端啟動時會自動建表
      - key: DATABASE_URL
        sync: false
